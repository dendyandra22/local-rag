<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local RAG Chat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">R</span>
      <div>
        <strong>Local RAG</strong>
        <span>Python workspace chat</span>
      </div>
    </div>

    <button id="newChat" class="new-chat" type="button">New chat</button>

    <section class="panel">
      <div class="panel-title">Files</div>
      <label class="upload-box" for="fileInput">
        <input id="fileInput" type="file" accept=".pdf,.txt,.md,.csv,.json,.log" multiple>
        <span>Upload PDF or text</span>
      </label>
      <div id="fileList" class="file-list"></div>
    </section>

    <section class="panel muted">
      <div class="panel-title">Backend</div>
      <p>Set <code>RAG_CHAT_HANDLER</code> to connect a Python function.</p>
    </section>
  </aside>

  <main class="chat-shell">
    <header class="topbar">
      <div>
        <h1>Chat</h1>
        <p id="statusText">Ready</p>
      </div>
      <button id="clearFiles" class="ghost" type="button">Clear selection</button>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div class="welcome">
        <h2>Ask your local RAG app</h2>
        <p>Upload files, select them in the sidebar, then send a question. The UI will call your local Python backend.</p>
      </div>
    </section>

    <form id="chatForm" class="composer">
      <textarea id="messageInput" rows="1" placeholder="Ask about your documents or local corpus"></textarea>
      <button id="sendButton" type="submit" aria-label="Send message">Send</button>
    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>
